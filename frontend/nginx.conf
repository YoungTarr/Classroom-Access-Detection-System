# =============================================================================
# nginx - เสิร์ฟไฟล์ static + reverse proxy ไปยัง backend
#
# เหตุผลที่ต้อง proxy: ถ้าหน้าเว็บ (localhost:3000) ยิง API ไป localhost:8000 ตรง ๆ
# เบราว์เซอร์จะถือว่าเป็นคนละ origin (พอร์ตต่างกัน) แล้วติด CORS
# การ proxy ผ่าน /api/ และ /ws/ ทำให้ทุกอย่างอยู่ origin เดียวกันคือ localhost:3000
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # รองรับชื่อไฟล์/ข้อความภาษาไทย
    charset utf-8;

    # -------------------------------------------------------------------------
    # ไฟล์ static (HTML/CSS/JS)
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # ระหว่างพัฒนา ไฟล์ถูก mount มาจากเครื่อง host โดยตรง
        # ปิด cache ไว้เพื่อให้กด refresh แล้วเห็นโค้ดใหม่ทันที ไม่ต้อง hard reload
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # -------------------------------------------------------------------------
    # REST API -> backend:8000
    # ชื่อ backend คือชื่อ service ใน docker-compose.yml (docker DNS แปลงให้เอง)
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # timeout สั้นพอที่จะรู้เร็วว่า backend ล่ม แต่ไม่สั้นจนตัด request ปกติ
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # -------------------------------------------------------------------------
    # WebSocket -> backend:8000 (จะได้ใช้จริงตั้งแต่เฟส 2: /ws/detect)
    #
    # WebSocket ต้องส่ง header Upgrade/Connection ต่อไปให้ backend
    # ถ้าลืม 2 บรรทัดนี้ การเชื่อมต่อจะถูกตัดเป็น HTTP ธรรมดาแล้ว handshake ล้มเหลว
    # -------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # สตรีมภาพต่อเนื่องเป็นชั่วโมง ต้องยืด timeout ไม่งั้นโดนตัดทุก 60 วินาที
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # ปิด buffering เพื่อให้เฟรมวิ่งถึงเบราว์เซอร์ทันที ไม่หน่วงรอสะสม
        proxy_buffering off;
    }
}
